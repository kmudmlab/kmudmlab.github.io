<!doctype html>
<html lang="{{ page.lang | default: 'ko' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | escape }}">
  <link rel="canonical" href="{% include snippets/page-url.html %}">
  {% include head/favicon.html %}
  <link rel="stylesheet" href="{{ '/assets/css/research.css' | relative_url }}">
</head>
<body id="top">
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/assets/images/logo/logo.svg' | relative_url }}" alt="" width="31" height="31">{{ site.title | escape }}</a>
      <nav class="site-nav" aria-label="사이트 메뉴">
        {% for item in site.data.navigation.header %}
          <a href="{{ item.url | relative_url }}"{% if item.url == page.url %} aria-current="page"{% endif %}>{{ item.title | default: item.titles.en | escape }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>
  {{ content }}
  <footer><div class="container"><span>© {{ site.title | escape }}</span></div></footer>
</body>
</html>
